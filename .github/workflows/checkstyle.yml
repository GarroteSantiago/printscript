name: Checkstyle

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  checkstyle:
    name: Run Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Restore-only: the build workflow already ran and wrote the cache entry this job
          # needs (compiled classes for checkstyleMain/checkstyleTest); writing another entry
          # here would just be redundant. See gradle/actions/docs/setup-gradle.md, "Select
          # which jobs should write to the cache".
          cache-read-only: true

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Run Checkstyle
        run: just checkstyle

      - name: Upload checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: '**/build/reports/checkstyle/'
          retention-days: 7
          if-no-files-found: ignore
